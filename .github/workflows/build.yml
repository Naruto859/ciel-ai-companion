name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_apk_url:
        description: Optional HTTPS URL of an already signed artifact to smoke test
        type: string
      signed_apk_sha256:
        description: Required SHA-256 when signed_apk_url is supplied
        type: string
      package_id:
        description: Package of that signed artifact
        type: string
        default: ai.ciel.companion.preview
      skip_unsigned_smoke:
        description: Skip CI-only signing smoke when final signed bytes will be validated separately
        type: boolean
        default: false
      smoke_checks:
        description: Full runtime suite, or a targeted setup/layout rerun of an exact signed APK
        type: choice
        options:
          - full
          - setup-layout
        default: full

permissions:
  contents: read

concurrency:
  group: ciel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-input:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.signed_apk_url, format('https://api.github.com/repos/{0}/releases/assets/', github.repository)) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # GitHub draft assets require push access. Keep that permission in this
    # download-only job: no checkout, repository script, build or APK executes.
    permissions:
      contents: write
    steps:
      - name: Stage the exact private draft asset
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_APK_URL: ${{ inputs.signed_apk_url }}
          SIGNED_APK_SHA256: ${{ inputs.signed_apk_sha256 }}
        run: |
          import hashlib, os, pathlib, re, subprocess
          from urllib.parse import urlparse
          parsed = urlparse(os.environ["SIGNED_APK_URL"])
          prefix = "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/assets/"
          expected = os.environ["SIGNED_APK_SHA256"].lower()
          if (parsed.scheme != "https" or parsed.netloc != "api.github.com" or
                  not parsed.path.startswith(prefix) or
                  not parsed.path[len(prefix):].isdigit() or parsed.query or parsed.fragment or
                  not re.fullmatch(r"[0-9a-f]{64}", expected)):
              raise SystemExit("An exact repository asset URL and SHA-256 are required")
          result = subprocess.run(["gh", "api", parsed.path, "-H", "Accept: application/octet-stream"],
              capture_output=True, timeout=90)
          if result.returncode:
              raise SystemExit("Draft asset download failed: " + result.stderr.decode(errors="replace")[:600])
          data = result.stdout
          if len(data) > 80 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Draft artifact size or SHA-256 check failed")
          pathlib.Path("staged-final.apk").write_bytes(data)
      - uses: actions/upload-artifact@v4
        with:
          name: ciel-signed-runtime-input
          path: staged-final.apk
          retention-days: 1
          if-no-files-found: error

  android:
    if: ${{ inputs.signed_apk_url == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and canonical release
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          -PuniversalApk=true -PdefaultLang=en
          :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          :desktop:compileKotlin -x :desktop:buildNative -x :desktop:buildBridge -x :desktop:buildTrashTool
      - uses: actions/upload-artifact@v4
        with:
          name: ciel-unsigned-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Parallel-install preview package
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          -PuniversalApk=true -PdefaultLang=en -PdbgSuffix=.preview :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ciel-unsigned-preview
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ciel-source-checks
          path: |
            core/build/libs/*.jar
            core/build/test-results/test/
            core/build/reports/tests/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*

  android-smoke:
    needs: [android, signed-input]
    if: ${{ always() && !cancelled() && ((needs.android.result == 'success' && !inputs.skip_unsigned_smoke) || (github.event_name == 'workflow_dispatch' && inputs.signed_apk_url != '' && (needs.signed-input.result == 'success' || needs.signed-input.result == 'skipped'))) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SIGNED_APK_URL: ${{ inputs.signed_apk_url }}
      SIGNED_APK_SHA256: ${{ inputs.signed_apk_sha256 }}
      REQUESTED_PACKAGE: ${{ inputs.package_id }}
      SMOKE_CHECKS: ${{ inputs.smoke_checks || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: env.SIGNED_APK_URL == ''
        with:
          name: ciel-unsigned-preview
          path: unsigned-preview
      - uses: actions/download-artifact@v4
        if: needs.signed-input.result == 'success'
        with:
          name: ciel-signed-runtime-input
          path: signed-preview
      - name: Prepare exactly the APK under test
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, urllib.request
          from urllib.parse import urlparse
          out = pathlib.Path("smoke-apk.apk")
          url = os.environ.get("SIGNED_APK_URL", "")
          package = "ai.ciel.companion.preview"
          if url:
              expected = os.environ.get("SIGNED_APK_SHA256", "").lower()
              package = os.environ.get("REQUESTED_PACKAGE") or package
              if urlparse(url).scheme != "https" or not re.fullmatch(r"[0-9a-f]{64}", expected):
                  raise SystemExit("An HTTPS URL and exact SHA-256 are required")
              if package not in ("ai.ciel.companion", "ai.ciel.companion.preview"):
                  raise SystemExit("Unexpected Ciel application ID")
              parsed = urlparse(url)
              asset_prefix = "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/assets/"
              if parsed.netloc == "api.github.com" and parsed.path.startswith(asset_prefix):
                  if not parsed.path[len(asset_prefix):].isdigit() or parsed.query:
                      raise SystemExit("Unexpected release asset API path")
                  # The isolated staging job is the only job with draft access.
                  data = pathlib.Path("signed-preview/staged-final.apk").read_bytes()
              else:
                  with urllib.request.urlopen(url, timeout=90) as response:
                      data = response.read(80 * 1024 * 1024 + 1)
              if len(data) > 80 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit("Artifact size or SHA-256 check failed")
              out.write_bytes(data)
          else:
              # This ephemeral key is only for CI. Production keys stay on the
              # release host, and this CI-signed package is never distributed.
              key = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ciel-ci.p12"
              subprocess.run(["keytool", "-genkeypair", "-noprompt", "-keystore", str(key),
                  "-storetype", "PKCS12", "-storepass", "ci-validation-only", "-alias", "ci",
                  "-keyalg", "RSA", "-keysize", "2048", "-validity", "2", "-dname", "CN=Ciel CI"], check=True)
              sdk = pathlib.Path(os.environ["ANDROID_HOME"])
              signer = sorted(sdk.glob("build-tools/*/apksigner"))[-1]
              apk = pathlib.Path("unsigned-preview/app-universal-release-unsigned.apk")
              subprocess.run([str(signer), "sign", "--ks", str(key), "--ks-key-alias", "ci",
                  "--ks-pass", "pass:ci-validation-only", "--out", str(out), str(apk)], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("SMOKE_PACKAGE=" + package + "\n")
      - name: Verify package before installing
        run: |
          python3 -m unittest discover -s tools -p test_verify_ciel_apk.py
          python3 tools/verify_ciel_apk.py smoke-apk.apk --package "$SMOKE_PACKAGE" --output smoke-package.json
      - name: Enable the runner's emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise the native app on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -cores 2 -memory 2048
          script: python3 tools/smoke_ciel_android.py --serial emulator-5554 --apk smoke-apk.apk --package "$SMOKE_PACKAGE" --checks "$SMOKE_CHECKS" --output smoke-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ciel-android-runtime
          path: |
            smoke-package.json
            smoke-evidence/
