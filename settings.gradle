pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        // Compose Multiplatform's Gradle plugin, for the desktop app.
        maven { url 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        // The dog's USB serial driver (usb-serial-for-android) is JitPack-only.
        // Aliyun proxies jitpack but answers 401 without an account, so this one
        // goes direct — keep it last, after the mirrors.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "body"
include ':app'
include ':core'
include ':desktop'
